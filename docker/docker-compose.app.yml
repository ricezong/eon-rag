# ============================================================
# 前后端编排，与数据库编排（docker-compose.yml）相互独立，不写在同一个文件里。
#
# 使用前提：先在 docker/ 下执行 `docker compose up -d --build` 把数据库起起来
# （宿主端口 15432）。本文件只负责后端 app 与前端 web 两个服务。
#
# 启动：export KB_DB_PASSWORD=... DEEPSEEK_API_KEY=... \
#         DASHSCOPE_EMBEDDING_API_KEY=... DASHSCOPE_RERANK_API_KEY=...
#       cd docker && docker compose -f docker-compose.app.yml up -d --build
# 访问：前端 http://127.0.0.1:8090 ，后端 http://127.0.0.1:8080
#
# 网络说明：app 通过 host.docker.internal:15432 连数据库（即数据库 compose
# 发布到宿主的端口），两个编排文件之间不共享 compose 网络，保持各自独立。
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    image: eon-rag-app:1.0.0
    container_name: eon-rag-app
    restart: unless-stopped
    extra_hosts:
      # Linux 上解析宿主机所需；Docker Desktop 自带该映射
      - "host.docker.internal:host-gateway"
    environment:
      KB_DB_URL: jdbc:postgresql://host.docker.internal:15432/eon_rag
      KB_DB_USERNAME: ${KB_DB_USERNAME:-postgres}
      KB_DB_PASSWORD: ${KB_DB_PASSWORD:?KB_DB_PASSWORD must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.xiaomimimo.com}
      DASHSCOPE_EMBEDDING_API_KEY: ${DASHSCOPE_EMBEDDING_API_KEY:?DASHSCOPE_EMBEDDING_API_KEY must be set}
      DASHSCOPE_RERANK_API_KEY: ${DASHSCOPE_RERANK_API_KEY:?DASHSCOPE_RERANK_API_KEY must be set}
      LLAMA_CLOUD_ENABLED: ${LLAMA_CLOUD_ENABLED:-false}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
      KB_API_KEY: ${KB_API_KEY:-}
      KB_LOG_LEVEL: ${KB_LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: eon-rag-web:1.0.0
    container_name: eon-rag-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # 宿主 8090，避免和本机已占用的 80 冲突；nginx 内 /api 反代到 app:8080
      - "8090:80"
