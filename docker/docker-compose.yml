# ============================================================
# eon-rag 一键部署
#
# 启动：export KB_DB_PASSWORD=... && cd docker && docker compose up -d --build
# 访问：数据库 127.0.0.1:15432；应用按 README 启动
#
# 首次启动时，postgres 会：
#   1. 按 POSTGRES_DB 建库 eon_rag
#   2. 执行 ./init/001_schema.sql（建扩展/表/索引/触发器）
#
# 注意：
#   - init 脚本仅在数据卷为空时执行；重跑需 docker compose down -v
# ============================================================

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: eon-postgres:16
    container_name: eon-rag-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: eon_rag
      POSTGRES_USER: postgres
      # 数据库密码
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD:?KB_DB_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai

    ports:
      # 宿主 15432 → 容器 5432，与本地开发默认 KB_DB_URL 一致
      - "15432:5432"

    volumes:
      - eon-rag-pgdata:/var/lib/postgresql/data
      - ./init/001_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    # 中文全文检索 + HNSW 向量索引场景适当放大共享内存与连接数
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
    shm_size: 1gb

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eon_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  eon-rag-pgdata:
    name: eon-rag-pgdata
